repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements

  # Black - Code formatter
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3.12
        files: ^backend/app/.*\.py$

  # isort - Import sorter
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        files: ^backend/app/.*\.py$
        args: ["--settings-path=pyproject.toml"]

  # Local custom hooks
  - repo: local
    hooks:
      # Check for local imports in functions
      - id: check-local-imports
        name: Check for local imports in functions
        entry: python scripts/check_local_imports.py
        language: system
        types: [python]
        pass_filenames: true
        files: ^backend/app/.*\.py$
        stages: [pre-commit]

      # mypy - Type checker (only on changed files for speed)
      # TEMPORARILY DISABLED for large commits (230+ files)
      # Run manually: mypy backend/app --config-file=pyproject.toml
      # - id: mypy
      #   name: Type check with mypy
      #   entry: mypy
      #   language: system
      #   types: [python]
      #   files: ^backend/app/.*\.py$
      #   pass_filenames: true
      #   args: ["--config-file=pyproject.toml", "--no-error-summary", "--explicit-package-bases"]
      #   stages: [pre-commit]

      # pylint - Code quality checker (only on changed files for speed)
      # TEMPORARILY DISABLED for large commits (230+ files)
      # Run manually: pylint backend/app --rcfile=pyproject.toml
      # - id: pylint
      #   name: Lint with pylint
      #   entry: pylint
      #   language: system
      #   types: [python]
      #   files: ^backend/app/.*\.py$
      #   pass_filenames: true
      #   args: ["--rcfile=pyproject.toml", "--score=no"]
      #   stages: [pre-commit]

      # import-linter - Architecture contracts
      - id: import-linter
        name: Check architecture contracts
        entry: python scripts/run_import_linter.py
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
        stages: [pre-commit]

# Global configuration
default_language_version:
  python: python3.12

# Files to exclude from all hooks
exclude: |
  (?x)^(
      .*migrations/.*|
      .*__pycache__/.*|
      .*/venv/.*|
      .*\.pyc$
  )$
