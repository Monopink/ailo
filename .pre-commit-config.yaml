repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
        exclude: ^\.vscode/settings\.json$
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements

  # Ruff - Replaces black, isort, pylint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        name: Lint with Ruff
        args: [--fix]
        files: ^backend/app/.*\.py$
      # Run the formatter
      - id: ruff-format
        name: Format with Ruff
        files: ^backend/app/.*\.py$

  # JavaScript/CSS checks for admin static files
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        name: Lint admin JavaScript
        files: ^backend/app/admin/static/.*\.js$
        args: ['--config', 'eslint.config.admin.mjs', '--fix']
        additional_dependencies:
          - eslint@9.17.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Format admin static files
        files: ^backend/app/admin/static/.*\.(js|css)$
        args: ['--write', '--config', '.prettierrc.admin.json']

  # Local custom hooks
  - repo: local
    hooks:
      # Check for local imports in functions
      - id: check-local-imports
        name: Check for local imports in functions
        entry: python scripts/check_local_imports.py
        language: system
        types: [python]
        pass_filenames: true
        files: ^backend/app/.*\.py$
        stages: [pre-commit]

      # mypy - Type checker
      - id: mypy
        name: Type check with mypy
        entry: python -m mypy
        language: system
        types: [python]
        files: ^backend/app/.*\.py$
        pass_filenames: true
        args:
          [
            "--config-file=pyproject.toml",
            "--no-error-summary",
          ]

      # import-linter - Architecture contracts
      - id: import-linter
        name: Check architecture contracts
        entry: python scripts/run_import_linter.py
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
        stages: [pre-commit]

# Global configuration
default_language_version:
  python: python3.12

# Files to exclude from all hooks
exclude: |
  (?x)^(
      .*migrations/.*|
      .*__pycache__/.*|
      .*/venv/.*|
      .*\.pyc$
  )$
