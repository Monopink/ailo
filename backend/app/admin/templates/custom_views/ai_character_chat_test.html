{% extends "layout.html" %}

{% block title %}<title>AI Character Chat Test</title>{% endblock %}

{% block header %}
<div class="d-flex justify-content-between align-items-center">
    <div>
        <h1>AI Character Chat Test</h1>
    </div>
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a href="{{ url_for(__name__ ~ ':index') }}">Dashboard</a>
        </li>
        <li class="breadcrumb-item">
            <a href="/qiao-dash/ai_character/list">AI Characters</a>
        </li>
        <li class="breadcrumb-item active">Chat Test</li>
    </ol>
</div>
{% endblock %}

{% block content %}
<style>
    .chat-test-container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
    }

    .status-bar {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .status-bar h3 {
        margin: 0 0 10px 0;
        font-size: 16px;
        font-weight: 600;
        color: #333;
    }

    .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .status-item {
        padding: 10px;
        background: white;
        border-radius: 6px;
        border: 1px solid #e9ecef;
    }

    .status-label {
        font-size: 12px;
        color: #6c757d;
        margin-bottom: 4px;
    }

    .status-value {
        font-size: 14px;
        color: #212529;
        font-weight: 500;
    }

    .scores-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }

    .score-item {
        padding: 8px;
        background: white;
        border-radius: 4px;
        border: 1px solid #e9ecef;
        text-align: center;
    }

    .score-name {
        font-size: 11px;
        color: #6c757d;
        margin-bottom: 4px;
    }

    .score-value {
        font-size: 14px;
        font-weight: 600;
        color: #0d6efd;
    }

    .chat-area {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        min-height: 400px;
        max-height: 600px;
        overflow-y: auto;
        padding: 20px;
        margin-top: 20px;
        display: flex;
        flex-direction: column-reverse;
    }

    .chat-area:empty::before {
        content: "开始测试对话...";
        color: #adb5bd;
        font-size: 14px;
    }

    .message {
        margin-bottom: 15px;
        padding: 10px 15px;
        border-radius: 8px;
        max-width: 70%;
        word-wrap: break-word;
    }

    .message-user {
        background: #e3f2fd;
        margin-left: auto;
        text-align: right;
    }

    .message-ai {
        background: #f5f5f5;
        margin-right: auto;
    }

    .control-bar {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
    }

    .control-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }

    .control-row:last-child {
        margin-bottom: 0;
    }

    .llm-select {
        flex: 0 0 200px;
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 14px;
    }

    .message-input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 14px;
        resize: none;
    }

    .btn {
        padding: 8px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-primary {
        background: #0d6efd;
        color: white;
    }

    .btn-primary:hover {
        background: #0b5ed7;
    }

    .btn-primary:disabled {
        background: #6c757d;
        cursor: not-allowed;
    }

    .btn-secondary {
        background: #6c757d;
        color: white;
    }

    .btn-secondary:hover {
        background: #5c636a;
    }

    .debug-info {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
        display: none;
    }

    .debug-info.show {
        display: block;
    }

    .debug-info h4 {
        margin: 0 0 10px 0;
        font-size: 14px;
        font-weight: 600;
        color: #333;
    }

    .debug-content {
        background: white;
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        max-height: 300px;
        overflow-y: auto;
    }

    .error-message {
        background: #f8d7da;
        color: #721c24;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        border: 1px solid #f5c6cb;
    }

    .loading {
        opacity: 0.6;
        pointer-events: none;
    }
</style>

<div class="chat-test-container">
    <div id="errorDisplay" style="display: none;" class="error-message"></div>
    <div class="status-bar">
        <h3>测试状态</h3>
        <div class="status-grid">
            <div class="status-item">
                <div class="status-label">角色ID</div>
                <div class="status-value" id="characterQiaoId">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">分类</div>
                <div class="status-value" id="characterCategory">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">风格</div>
                <div class="status-value" id="characterStyle">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">性格</div>
                <div class="status-value" id="characterPersonality">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">测试用户</div>
                <div class="status-value" id="testUserNickname">-</div>
            </div>
        </div>
        <div id="scoresContainer" style="display: none;">
            <h4 style="margin: 15px 0 10px 0; font-size: 14px; font-weight: 600;">关系分数</h4>
            <div class="scores-grid" id="scoresGrid"></div>
        </div>
    </div>
    <div class="control-bar">
        <div class="control-row">
            <select class="llm-select" id="llmSelect">
                <option value="">选择LLM配置...</option>
            </select>
            <textarea class="message-input" id="messageInput" placeholder="输入测试消息..." rows="2"></textarea>
            <button class="btn btn-primary" id="sendBtn" disabled>发送</button>
        </div>
        <div class="control-row">
            <button class="btn btn-secondary" id="newSessionBtn">新建会话</button>
            <button class="btn btn-secondary" id="toggleDebugBtn">显示调试信息</button>
        </div>
    </div>
    <div class="debug-info" id="debugInfo">
        <h4>调试信息</h4>
        <div class="debug-content" id="debugContent"></div>
    </div>
    <div class="chat-area" id="chatArea"></div>
</div>

<script>
    var messages = [];
    var characterId = "{{ character_id }}";
    var currentDebugInfo = null;

    document.addEventListener('DOMContentLoaded', function () {
        loadReadinessInfo();
        setupEventListeners();
    });

    function loadReadinessInfo() {
        fetch('/qiao-dash/ai-character-chat-test?action=readiness&character_id=' + characterId)
            .then(function (response) { return response.json(); })
            .then(function (data) {
                if (!data.ready) {
                    showError('测试环境未就绪: ' + data.error_message);
                    return;
                }
                document.getElementById('characterQiaoId').textContent = data.character_info.qiao_id;
                document.getElementById('characterCategory').textContent = data.character_info.category;
                document.getElementById('characterStyle').textContent = data.character_info.style;
                document.getElementById('characterPersonality').textContent = data.character_info.personality;
                document.getElementById('testUserNickname').textContent = data.test_user_info.nickname;
                if (data.relationship_scores && data.relationship_scores.length > 0) {
                    var scoresGrid = document.getElementById('scoresGrid');
                    scoresGrid.innerHTML = data.relationship_scores.map(function (score) {
                        return '<div class="score-item"><div class="score-name">' + score.dimension_name + '</div><div class="score-value">' + score.score + '</div></div>';
                    }).join('');
                    document.getElementById('scoresContainer').style.display = 'block';
                }
                var llmSelect = document.getElementById('llmSelect');
                data.available_llm_configs.forEach(function (config) {
                    var option = document.createElement('option');
                    option.value = config.config_key;
                    option.textContent = config.model_name + ' (' + config.provider_name + ')';
                    llmSelect.appendChild(option);
                });
                llmSelect.addEventListener('change', function () {
                    document.getElementById('sendBtn').disabled = !llmSelect.value;
                });
            })
            .catch(function (error) {
                showError('加载测试环境失败: ' + error.message);
            });
    }

    function setupEventListeners() {
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('newSessionBtn').addEventListener('click', newSession);
        document.getElementById('toggleDebugBtn').addEventListener('click', toggleDebug);
        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.ctrlKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    }

    function sendMessage() {
        var messageInput = document.getElementById('messageInput');
        var llmSelect = document.getElementById('llmSelect');
        var sendBtn = document.getElementById('sendBtn');
        var message = messageInput.value.trim();
        var llmConfigKey = llmSelect.value;
        if (!message || !llmConfigKey) return;
        appendMessage('user', message);
        messageInput.value = '';
        sendBtn.disabled = true;
        document.querySelector('.chat-test-container').classList.add('loading');
        var formData = new FormData();
        formData.append('character_id', characterId);
        formData.append('llm_config_key', llmConfigKey);
        formData.append('test_message', message);
        fetch('/qiao-dash/ai-character-chat-test', { method: 'POST', body: formData })
            .then(function (response) { return response.json(); })
            .then(function (data) {
                if (!data.success) {
                    showError(data.error || '测试请求失败');
                    return;
                }
                var conversation = data.conversation;
                conversation.all_messages.forEach(function (msg) {
                    appendMessage('ai', msg);
                });
                currentDebugInfo = data;
                updateDebugInfo();
            })
            .catch(function (error) {
                showError('请求失败: ' + error.message);
            })
            .finally(function () {
                document.querySelector('.chat-test-container').classList.remove('loading');
                sendBtn.disabled = false;
            });
    }

    function appendMessage(type, content) {
        var chatArea = document.getElementById('chatArea');
        var messageDiv = document.createElement('div');
        messageDiv.className = 'message message-' + type;
        messageDiv.textContent = content;
        messages.push({ type: type, content: content, timestamp: new Date() });
        // Insert at the beginning (newest on top)
        chatArea.insertBefore(messageDiv, chatArea.firstChild);
    }

    function newSession() {
        if (messages.length === 0) return;
        if (confirm('确定要开始新会话吗？当前对话将被清空。')) {
            messages = [];
            document.getElementById('chatArea').innerHTML = '';
            currentDebugInfo = null;
            document.getElementById('debugContent').textContent = '';
            hideError();
        }
    }

    function toggleDebug() {
        var debugInfo = document.getElementById('debugInfo');
        var btn = document.getElementById('toggleDebugBtn');
        if (debugInfo.classList.contains('show')) {
            debugInfo.classList.remove('show');
            btn.textContent = '显示调试信息';
        } else {
            debugInfo.classList.add('show');
            btn.textContent = '隐藏调试信息';
            updateDebugInfo();
        }
    }

    function updateDebugInfo() {
        if (!currentDebugInfo) return;
        var debugContent = document.getElementById('debugContent');
        debugContent.textContent = JSON.stringify(currentDebugInfo, null, 2);
    }

    function showError(message) {
        var errorDisplay = document.getElementById('errorDisplay');
        errorDisplay.textContent = message;
        errorDisplay.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorDisplay').style.display = 'none';
    }
</script>
{% endblock %}
