version: '3.8'

services:
  python:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DEBUG=1
      - RELOAD=1
    volumes:
      - ./app:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]

  db:
    environment:
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_dev/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password