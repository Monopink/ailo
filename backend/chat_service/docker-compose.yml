services:
  python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_dev
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://root:root@db:3306/says_dev
      - DEBUG=1
      - RELOAD=1
      - PYTHONPATH=/app
    networks:
      - app-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0
    container_name: mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: says_dev
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_HOST: '%'
      MYSQL_INIT_CONNECT: 'SET NAMES utf8mb4'
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_dev/conf:/etc/mysql/conf.d:ro
      - ./mysql_dev/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
    networks:
      - app-network
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle_logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_FILTER=status=running
    networks:
      - app-network
    restart: unless-stopped
    labels:
      - "com.dozzle.enable=true"

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local