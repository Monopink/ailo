<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAYS Dome</title>
    <style>
        /* 防止 iOS 点击时的默认高亮效果 */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 修改输入框样式，优化移动端体验 */
        input:not([type="checkbox"]),
        /* 排除复选框 */
        button {
            font-size: 16px;
            /* 防止 iOS 自动放大 */
            border-radius: 4px;
            border: 1px solid #ccc;
            padding: 8px 12px;
            appearance: none;
            /* 移除默认样式 */
            -webkit-appearance: none;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            /* 优化触摸体验 */
        }

        button:active {
            background-color: #0056b3;
        }

        /* 优化移动端文本选择 */
        .messages {
            -webkit-user-select: text;
            user-select: text;
        }

        /* 优化移动端滚动 */
        .messages {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        .chat-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .messages {
            height: calc(100vh - 250px);
            min-height: 300px;
        }

        .messages {
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .message {
            margin: 5px 0;
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .message-content {
            margin-right: 10px;
        }

        .message-time {
            font-size: 0.8em;
            color: #666;
            white-space: nowrap;
        }

        .self-message {
            background-color: #e3f2fd;
        }

        .other-message {
            background-color: #f5f5f5;
            text-align: left;
        }

        .system-message {
            color: #666;
            font-style: italic;
            text-align: center;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #message {
            flex-grow: 1;
        }

        .connection-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .status-connected {
            background-color: #4caf50;
            color: white;
        }

        .status-disconnected {
            background-color: #f44336;
            color: white;
        }

        /* 移动端适配优化 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                /* 防止 iOS 橡皮筋效果 */
                overscroll-behavior: none;
            }

            .chat-container {
                padding: 5px;
            }

            .input-group {
                flex-direction: column;
                gap: 8px;
            }

            .input-group input,
            .input-group button {
                width: 100%;
                margin: 0;
                height: 40px;
                /* 更容易点击 */
            }

            .input-container {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px;
                background: white;
                box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            }

            .messages {
                /* 调整消息区域高度，考虑固定的输入框 */
                height: calc(100vh - 280px);
                margin-bottom: 60px;
            }

            /* 优化消息显示 */
            .message {
                padding: 8px;
                margin: 5px 0;
                border-radius: 8px;
            }
        }

        /* 状态指示器容器 */
        .status-bar {
            background: #f8f9fa;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 500;
        }

        /* 状态指示器前的小圆点 */
        .connection-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-connected::before {
            background-color: #4caf50;
        }

        .status-disconnected::before {
            background-color: #f44336;
        }

        .status-typing::before {
            background-color: #ff9800;
        }

        .status-connected {
            color: #2e7d32;
            background-color: #e8f5e9;
        }

        .status-disconnected {
            color: #c62828;
            background-color: #ffebee;
        }

        .status-typing {
            color: #ef6c00;
            background-color: #fff3e0;
        }

        /* 调整消息容器样式以配合新的状态栏 */
        .messages {
            border-top: none;
            border-radius: 0 0 4px 4px;
        }

        /* 控制面板样式更新 */
        .control-panel {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .control-panel-header {
            padding: 10px 15px;
            background: #e9ecef;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-panel-content {
            padding: 15px;
            display: none;
        }

        .control-panel-content.show {
            display: block;
        }

        .control-panel h3 {
            margin: 0;
            font-size: 16px;
        }

        .toggle-icon {
            font-family: monospace;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .control-panel {
                margin: 10px 0;
            }

            .control-group {
                flex-direction: column;
            }

            .control-item {
                width: 100%;
            }
        }

        /* 控制面板内容样式优化 */
        .control-panel-content {
            padding: 15px;
            display: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-item {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Typing 消息样式 */
        .message.self-message[data-type="typing"],
        .message.self-message[data-type="typing_end"],
        .message.other-message[data-type="typing"],
        .message.other-message[data-type="typing_end"] {
            font-style: italic;
            color: #999;
        }

        .message-type {
            font-size: 0.8em;
            color: #666;
            margin-left: 8px;
        }
    </style>
    <script>
        let socket;
        let messageHistory = [];
        let isWaitingResponse = false;     // 是否正在等待回复
        let hasTypingSent = false;         // 是否已经发送过 typing 消息
        let hasTypingEndSent = false;      // 是否已经发送过 typing_end 消息

        const MessageTypes = {
            CHAT: 'chat',
            TYPING: 'typing',
            TYPING_END: 'typing_end'
        };

        // 简化配置
        let config = {
            typingStatusDuration: 2000  // typing 状态显示持续时间
        };

        function getWebSocketUrl() {
            // 获取当前页面的协议和主机地址
            const host = window.location.hostname;
            const port = '8000'; // WebSocket服务端口
            return `${host}:${port}`;
        }

        function addMessage(content, type = 'system', messageType = null, shouldSave = true) {
            const messages = document.getElementById("messages");
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;

            if (messageType) {
                messageDiv.setAttribute('data-type', messageType);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;  // 直接显示内容，不添加任何标记

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            const now = new Date();
            timeDiv.textContent = now.toLocaleTimeString();

            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;

            if (shouldSave) {
                messageHistory.push({
                    content: content,
                    type: type,
                    messageType: messageType,
                    message_time: now.toISOString()
                });
                saveChatHistory();
            }
        }

        function connect() {
            const fromId = document.getElementById("from_entity").value;
            if (!fromId.trim()) {
                addMessage("Please enter a from ID", "system");
                return;
            }

            const wsBaseUrl = getWebSocketUrl();
            socket = new WebSocket(`ws://${wsBaseUrl}/ws/${fromId}`);


            socket.onopen = () => {
                addMessage("Connected to server", "system");
                updateConnectionStatus();
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.error) {
                        addMessage(`Error: ${data.error}`, "system");
                        console.error("Server error:", data);
                    } else if (data.message_type === MessageTypes.CHAT) {
                        // data.content is the stringified JSON from response_content
                        // It needs to be parsed again.
                        try {
                            const innerData = JSON.parse(data.content || data.reply);
                            addMessage(innerData.content, 'other', MessageTypes.CHAT); // Use innerData.content
                        } catch (e) {
                            console.error("Failed to parse inner message content:", e);
                            // Fallback: display the raw string if inner parsing fails
                            addMessage(data.content || data.reply, 'other', MessageTypes.CHAT);
                        }
                        isWaitingResponse = false;
                        hasTypingSent = false;
                        hasTypingEndSent = false;
                        updateConnectionStatus();
                    } else if (data.message_type === MessageTypes.TYPING || data.message_type === MessageTypes.TYPING_END) {
                        const displayType = data.message_type.charAt(0).toUpperCase() + data.message_type.slice(1);
                        addMessage(`[${displayType}]`, 'other', data.message_type);

                        // 更新状态指示器，不显示时长
                        const statusDiv = document.getElementById("connection-status");
                        if (data.message_type === MessageTypes.TYPING) {
                            statusDiv.textContent = "Typing";
                            statusDiv.className = "connection-status status-typing";
                            setTimeout(() => {
                                updateConnectionStatus();
                            }, config.typingStatusDuration);
                        } else {
                            updateConnectionStatus();
                        }
                    }
                } catch (e) {
                    console.error("Failed to parse message:", e);
                    addMessage(`Received: ${event.data}`, "system");
                }
            };

            socket.onclose = (event) => {
                console.log("WebSocket closed:", event);
                addMessage("Connection closed", "system");
                updateConnectionStatus();
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                addMessage("Connection error occurred", "system");
            };

            updateConnectionStatus();
        }

        function createMessage(content, messageType) {
            return {
                from_entity: document.getElementById("from_entity").value,
                to_entity: document.getElementById("to_entity").value,
                content: content || '',
                message_type: messageType,
                message_time: new Date().toISOString()
            };
        }

        function sendTypingStatus(type = MessageTypes.TYPING) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;

            const message = createMessage('', type);
            socket.send(JSON.stringify(message));

            // 首字母大写，设置data-type但不显示类型标记
            const displayType = type.charAt(0).toUpperCase() + type.slice(1);
            addMessage(`[${displayType}]`, 'self', type, true);  // 添加参数控制是否显示类型标记
        }

        function handleTyping() {
            const input = document.getElementById("message");
            const hasText = input.value.trim().length > 0;

            if (isWaitingResponse) {
                if (hasText) {
                    if (!hasTypingSent || hasTypingEndSent) {
                        // 如果未发送过 typing 消息，或者已经发送过 typing_end，则可以发送 typing
                        sendTypingStatus(MessageTypes.TYPING);
                        hasTypingSent = true;
                        hasTypingEndSent = false;
                    }
                } else {
                    if (hasTypingSent && !hasTypingEndSent) {
                        // 如果已发送过 typing 消息且未发送过 typing_end，则可以发送 typing_end
                        sendTypingStatus(MessageTypes.TYPING_END);
                        hasTypingEndSent = true;
                        hasTypingSent = false;  // 允许再次发送 typing
                    }
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById("message");
            const content = input.value.trim();

            if (!content) return;

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                addMessage("Not connected to server", "system");
                return;
            }

            const message = createMessage(content, MessageTypes.CHAT);
            socket.send(JSON.stringify(message));
            addMessage(content, "self");

            isWaitingResponse = true;
            hasTypingSent = false;      // 发送消息后重置所有状态
            hasTypingEndSent = false;
            input.value = '';
        }

        // 下载聊天记录
        function downloadHistory() {
            const historyData = JSON.stringify(messageHistory, null, 2);
            const blob = new Blob([historyData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat-history-${new Date().toISOString()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function updateConnectionStatus() {
            const statusDiv = document.getElementById("connection-status");
            if (!socket) {
                statusDiv.textContent = "Not connected";
                statusDiv.className = "connection-status status-disconnected";
                return;
            }

            switch (socket.readyState) {
                case WebSocket.CONNECTING:
                    statusDiv.textContent = "Connecting...";
                    statusDiv.className = "connection-status status-disconnected";
                    break;
                case WebSocket.OPEN:
                    statusDiv.textContent = "Connected";
                    statusDiv.className = "connection-status status-connected";
                    break;
                case WebSocket.CLOSING:
                    statusDiv.textContent = "Disconnecting...";
                    statusDiv.className = "connection-status status-disconnected";
                    break;
                case WebSocket.CLOSED:
                    statusDiv.textContent = "Disconnected";
                    statusDiv.className = "connection-status status-disconnected";
                    break;
            }
        }

        function toggleControlPanel() {
            const content = document.querySelector('.control-panel-content');
            const icon = document.querySelector('.toggle-icon');
            const isVisible = content.classList.toggle('show');
            icon.textContent = isVisible ? '[-]' : '[+]';
        }

        // 初始化时加载历史消息
        function loadChatHistory() {
            const savedHistory = localStorage.getItem('chatHistory');
            if (savedHistory) {
                messageHistory = JSON.parse(savedHistory);
                messageHistory.forEach(msg => {
                    addMessage(msg.content, msg.type, msg.messageType, false);
                });
            }
        }

        // 保存消息到本地存储
        function saveChatHistory() {
            localStorage.setItem('chatHistory', JSON.stringify(messageHistory));
        }

        // 清空聊天记录
        function clearChatHistory() {
            if (confirm('Are you sure you want to clear all chat history?')) {
                messageHistory = [];
                localStorage.removeItem('chatHistory');
                const messages = document.getElementById("messages");
                messages.innerHTML = '';
                addMessage("Chat history cleared", "system");
            }
        }

        // 页面加载时初始化
        window.onload = function () {
            const messageInput = document.getElementById("message");
            messageInput.addEventListener('input', handleTyping);
            messageInput.addEventListener('keyup', function (e) {
                if (isWaitingResponse) {
                    handleTyping();
                }
            });
            loadChatHistory();
        };
    </script>
</head>

<body>
    <div class="chat-container">
        <h1>SAYS</h1>

        <div class="control-panel">
            <div class="control-panel-header" onclick="toggleControlPanel()">
                <h3>Controls Panel</h3>
                <span class="toggle-icon">[+]</span>
            </div>
            <div class="control-panel-content">
                <div class="control-group">
                    <div class="control-item">
                        <input id="from_entity" placeholder="Enter From ID">
                        <input id="to_entity" placeholder="Enter To ID">
                        <button onclick="connect()">Connect</button>
                    </div>
                    <div class="control-item">
                        <label for="typingStatusDuration">Typing status duration (ms):</label>
                        <input type="number" id="typingStatusDuration" value="2000" min="0" step="100"
                            onchange="config.typingStatusDuration = parseInt(this.value)">
                    </div>
                    <div class="control-item">
                        <button onclick="downloadHistory()">Download Chat History</button>
                        <button onclick="clearChatHistory()" style="background-color: #dc3545;">Clear Chat
                            History</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span id="connection-status" class="connection-status status-disconnected">Not connected</span>
        </div>

        <div id="messages" class="messages"></div>
        <div class="input-container">
            <input id="message" placeholder="Type a message" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</body>

</html>
