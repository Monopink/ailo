<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYS Dome</title>
    <style>
        .chat-container {
            max-width: 800px;
            margin: 20px auto;
        }
        .messages {
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .message-content {
            margin-right: 10px;
        }
        .message-time {
            font-size: 0.8em;
            color: #666;
            white-space: nowrap;
        }
        .self-message {
            background-color: #e3f2fd;
        }
        .other-message {
            background-color: #f5f5f5;
            text-align: left;
        }
        .system-message {
            color: #666;
            font-style: italic;
            text-align: center;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #message {
            flex-grow: 1;
        }
        .connection-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            margin-left: 10px;
            font-size: 0.9em;
        }
        .status-connected {
            background-color: #4caf50;
            color: white;
        }
        .status-disconnected {
            background-color: #f44336;
            color: white;
        }
    </style>
    <script>
        let socket;
        let messageHistory = [];
        let typingTimeout;

        function addMessage(content, type = 'system') {
            const messages = document.getElementById("messages");
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;

            // 创建消息内容元素
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            // 创建时间元素
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            const now = new Date();
            timeDiv.textContent = now.toLocaleTimeString();

            // 添加内容和时间到消息div
            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);
            
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;

            // 保存消息历史
            messageHistory.push({
                content: content,
                type: type,
                timestamp: now.toISOString()
            });
        }

        function connect() {
            const fromId = document.getElementById("from_id").value;
            if (!fromId.trim()) {
                addMessage("Please enter a from ID", "system");
                return;
            }

            socket = new WebSocket(`ws://localhost:8000/ws/${fromId}`);

            socket.onopen = () => {
                addMessage("Connected to server", "system");
                updateConnectionStatus();
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.error) {
                        addMessage(`Error: ${data.error}`, "system");
                        console.error("Server error:", data);
                    } else if (data.message_type === 'typing') {
                        // Clear any existing timeout
                        if (typingTimeout) {
                            clearTimeout(typingTimeout);
                        }
                        
                        // Update status to typing
                        const statusDiv = document.getElementById("connection-status");
                        statusDiv.textContent = "Typing...";
                        statusDiv.className = "connection-status status-connected";
                        
                        // Set new timeout to revert status after 2 seconds
                        typingTimeout = setTimeout(() => {
                            statusDiv.textContent = "Connected";
                            statusDiv.className = "connection-status status-connected";
                        }, 2000);
                    } else {
                        // Clear typing timeout if exists and update status immediately
                        if (typingTimeout) {
                            clearTimeout(typingTimeout);
                            const statusDiv = document.getElementById("connection-status");
                            statusDiv.textContent = "Connected";
                            statusDiv.className = "connection-status status-connected";
                        }
                        
                        // Process the message
                        const messageType = data.message_type === 'chat' ? 'other' : data.message_type || "system";
                        const content = data.content || data.reply;
                        addMessage(content, messageType);
                    }
                } catch (e) {
                    console.error("Failed to parse message:", e);
                    addMessage(`Received: ${event.data}`, "system");
                }
            };

            socket.onclose = (event) => {
                console.log("WebSocket closed:", event);
                addMessage("Connection closed", "system");
                updateConnectionStatus();
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
                addMessage("Connection error occurred", "system");
            };

            updateConnectionStatus();
        }

        function sendMessage() {
            const input = document.getElementById("message");
            const fromId = document.getElementById("from_id").value;
            const toId = document.getElementById("to_id").value;
            const content = input.value.trim();
            
            if (!content) {
                return;
            }

            if (!toId) {
                addMessage("Please enter a to ID", "system");
                return;
            }
            
            if (socket && socket.readyState === WebSocket.OPEN) {
                const message = {
                    from_id: fromId,
                    to_id: toId,
                    content: content,
                    timestamp: new Date().toISOString()
                };
                
                socket.send(JSON.stringify(message));
                addMessage(content, "self");
                input.value = '';
            } else {
                addMessage("Not connected to server", "system");
            }
        }

        // 下载聊天记录
        function downloadHistory() {
            const historyData = JSON.stringify(messageHistory, null, 2);
            const blob = new Blob([historyData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat-history-${new Date().toISOString()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function updateConnectionStatus() {
            const statusDiv = document.getElementById("connection-status");
            if (!socket) {
                statusDiv.textContent = "Not connected";
                statusDiv.className = "connection-status status-disconnected";
                return;
            }

            switch (socket.readyState) {
                case WebSocket.CONNECTING:
                    statusDiv.textContent = "Connecting...";
                    statusDiv.className = "connection-status status-disconnected";
                    break;
                case WebSocket.OPEN:
                    statusDiv.textContent = "Connected";
                    statusDiv.className = "connection-status status-connected";
                    break;
                case WebSocket.CLOSING:
                    statusDiv.textContent = "Disconnecting...";
                    statusDiv.className = "connection-status status-disconnected";
                    break;
                case WebSocket.CLOSED:
                    statusDiv.textContent = "Disconnected";
                    statusDiv.className = "connection-status status-disconnected";
                    break;
            }
        }
    </script>
</head>
<body>
    <div class="chat-container">
        <h1>SAYS</h1>
        <div>
            <input id="from_id" placeholder="Enter From ID">
            <input id="to_id" placeholder="Enter To ID">
            <button onclick="connect()">Connect</button>
            <button onclick="downloadHistory()">Download Chat History</button>
            <span id="connection-status" class="connection-status status-disconnected">Not connected</span>
        </div>
        <br>
        <div id="messages" class="messages"></div>
        <div class="input-container">
            <input id="message" 
                   placeholder="Type a message" 
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</body>
</html>
