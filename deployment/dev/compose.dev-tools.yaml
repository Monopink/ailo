# Development tools Docker Compose configuration
# This file contains development and debugging tools
# Use together with compose.yaml for full development environment

services:
  # ngrok for exposing webhook to LeanCloud
  ngrok:
    container_name: ngrok
    build:
      context: ../../ngrok
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "4040:4040"
    networks:
      - default
    # Note: ngrok will wait for backend to be ready internally
    restart: always

  # Dozzle for log viewing
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"
    restart: always
    networks:
      - default
  #
  # # Development-only web frontend (commented out by default)
  # web_dev:
  #   container_name: web_dev_container
  #   build:
  #     context: ../../frontend/web_dev
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:80"
  #   networks:
  #     - default
  #   restart: always

networks:
  default:
    driver: bridge
