# Development tools Docker Compose configuration
# This file contains development and debugging tools
# Use together with docker-compose.yml for full development environment

services:
  # ngrok for exposing bot_message_service webhook to LeanCloud
  ngrok:
    container_name: ngrok_container
    build:
      context: ../backend/dev_tools/ngrok
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "4040:4040"
    networks:
      - says-network
    # Note: ngrok will wait for bot_message_service to be ready internally
    restart: always

  # Dozzle for log viewing
  dozzle:
    container_name: dozzle_container
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"
    restart: always
    networks:
      - says-network
  #
  # # Development-only web frontend (commented out by default)
  # web_dev:
  #   container_name: web_dev_container
  #   build:
  #     context: ../frontend/web_dev
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:80"
  #   networks:
  #     - says-network
  #   restart: always

networks:
  says-network:
    driver: bridge
