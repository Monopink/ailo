version: '3.8'

services:
  postgres_db:
    image: postgres:16
    container_name: postgres_db_container
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Production PostgreSQL optimizations
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      # Production PostgreSQL performance optimizations
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=32MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB
    ports:
      # Expose PostgreSQL port for external access (pgAdmin, etc.)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - says-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  # Backend Service
  backend:
    container_name: backend
    build:
      context: ../backend/app
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      MYSQL_HOST: mysql_db
      MYSQL_PORT: 3306
      ENVIRONMENT: production
      DEBUG: false
    volumes:
      - ../logs:/app/logs
    networks:
      - says-network
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Nginx Reverse Proxy
  nginx:
    container_name: nginx_container
    build:
      context: ../nginx
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - says-network
    depends_on:
      - web_frontend
      - backend
    restart: always

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot_container
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    depends_on:
      - nginx

# Define the network for services to communicate
networks:
  says-network:
    driver: bridge

# Define volumes for persistent storage
volumes:
  postgres_data:
  certbot_webroot:
  certbot_certs:
