# This file contains the consolidated monolithic backend service
# Use docker-compose.dev-tools.yml for development tools (ngrok, dozzle)
# Use docker-compose.prod.yml for production deployment
# Use docker-compose.staging.yml for staging deployment

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db_container
    env_file:
      - .env
    # MySQL environment variables are loaded from .env file
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "33061:3306" # Expose MySQL port for external access in dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/database/conf:/etc/mysql/conf.d:ro
      - ../backend/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - says-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  # Backend Service
  backend:
    container_name: backend
    build:
      context: ../backend/app
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app
      - ../logs:/app/logs
    networks:
      - says-network
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: always

  # Web Frontend
  web_frontend:
    container_name: web_frontend_container
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    env_file:
      - ../frontend/web/.env.development
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/web:/app
      - /app/node_modules
    networks:
      - says-network
    depends_on:
      - backend
    restart: always

networks:
  says-network:
    driver: bridge

volumes:
  mysql_data:
