version: '3.8'

services:
  postgres_db:
    image: postgres:16
    container_name: postgres_db_container
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # PostgreSQL performance optimizations
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Sample data loading control (set to false in production)
      LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-true}
    command:
      # PostgreSQL performance and configuration optimizations
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - says-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  # Backend Service
  backend:
    container_name: backend_container
    build:
      context: ../backend
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      # Mount the app directory to /backend/app for hot-reload during development
      - ../backend/app:/backend/app
      - ../logs:/backend/logs
    networks:
      - says-network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: always

networks:
  says-network:
    driver: bridge

volumes:
  postgres_data:
