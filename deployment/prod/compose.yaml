# Production-specific Compose overrides.
# This file is merged with deployment/compose.base.yaml.

services:
  postgres:
    env_file:
      - .env
      - prod/.env
    environment:
      # Production PostgreSQL optimizations
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      # Production PostgreSQL performance optimizations
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=32MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql
      - ../backend/database/init:/docker-entrypoint-initdb.d:ro
    restart: always

  # Backend Service
  backend:
    build:
      target: prod
    env_file:
      - .env
      - prod/.env
    volumes:
      - /opt/ailo-prod/logs:/backend/logs
    restart: always

  # Nginx Reverse Proxy
  nginx:
    env_file:
      - .env
      - prod/.env
    environment:
      ADMIN_AUTH_REALM: Production Admin
    volumes:
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ./prod/secrets/.htpasswd:/etc/nginx/.htpasswd:ro
      - /opt/ailo-prod/logs/nginx:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    restart: always

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email --non-interactive -d ${DOMAIN}
    depends_on:
      - nginx

volumes:
  certbot_webroot:
  certbot_certs:
