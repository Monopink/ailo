services:
  # Accounts Service
  accounts_service:
    container_name: accounts_service_container
    build:
      context: ./backend/accounts_service
      # Use the production Dockerfile
      dockerfile: Dockerfile.prod
    env_file:
      # Load production environment variables
      - ./.env.prod
    environment:
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      # Expose the service port
      - "${ACCOUNTS_SERVICE_PORT}:8000"
    networks:
      - says-network
    # In production, it depends on an external DB, so depends_on is removed.
    # Health checks or entrypoint scripts should handle DB readiness.
    restart: always

  # Bots Service
  contacts_service:
    container_name: contacts_service_container
    build:
      context: ./backend/contacts_service
      dockerfile: Dockerfile.prod
    env_file:
      - ./.env.prod
    ports:
      - "${CONTACTS_SERVICE_PORT}:8000"
    networks:
      - says-network
    restart: always

  # Chat Service
  bot_message_service:
    container_name: bot_message_service_container
    build:
      context: ./backend/bot_message_service
      dockerfile: Dockerfile.prod
    env_file:
      - ./.env.prod
    ports:
      - "${BOT_MESSAGE_SERVICE_PORT}:8000"
    networks:
      - says-network
    restart: always

# Define the network for services to communicate
networks:
  says-network:
    driver: bridge
