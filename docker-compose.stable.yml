version: '3.8'

services:
  # Stable MySQL Database Service
  stable_mysql:
    image: mysql:8.0
    container_name: stable_mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: 
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"  # Use different port to avoid conflict
    volumes:
      - stable_mysql_data:/var/lib/mysql  # Use dedicated named volume
      - ./database/conf:/etc/mysql/conf.d:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - stable-network
    restart: always

  # Stable Chat Service
  stable_chat:
    container_name: stable_chat_container
    build:
      context: ./backend/chat_service
      dockerfile: Dockerfile.prod  # Use production Dockerfile
    environment:
      # Set environment variables directly, no volume mounting
      PYTHONDONTWRITEBYTECODE: 1
      PROJECT_NAME: "Stable Chat Service"
      DB_HOST: "stable_mysql"
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      LOG_LEVEL: "WARNING"  # Set log level to WARNING
    ports:
      - "8100:8000"  # Use different port to avoid conflict
    networks:
      - stable-network
    depends_on:
      - stable_mysql
    restart: always

  # Stable Frontend Service
  stable_web_dev:
    container_name: stable_web_dev_container
    build:
      context: ./frontend/web_dev
      dockerfile: Dockerfile.stable  # Use stable environment specific Dockerfile
    ports:
      - "8101:80"  # Use different port to avoid conflict
    networks:
      - stable-network
    depends_on:
      - stable_chat
    restart: always

networks:
  stable-network:
    driver: bridge

volumes:
  stable_mysql_data:
    name: stable_mysql_data  # Explicitly named for easier backup and identification