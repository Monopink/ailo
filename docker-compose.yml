services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db_container
    # Read environment variables from the .env file
    env_file:
      - ./.env
    environment:
      # These are required by the MySQL image to initialize the database
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Expose MySQL port to the host machine for direct access if needed
      - "${MYSQL_PORT}:3306"
    volumes:
      # Persist database data
      - mysql_data:/var/lib/mysql
      # Mount custom configuration
      - ./database/conf:/etc/mysql/conf.d:ro
      # Run initialization scripts on startup
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - says-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-p${MYSQL_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # Accounts Service
  accounts_service:
    container_name: accounts_service_container
    # Build the service from its Dockerfile
    build:
      context: ./backend/accounts_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      # Expose the service port to the host machine
      - "${ACCOUNTS_SERVICE_PORT}:8000"
    volumes:
      # Mount local code into the container for hot-reloading
      - ./backend/accounts_service:/app
      - ./logs/accounts_service:/app/logs
    networks:
      - says-network
    # Depends on the database to be ready
    depends_on:
      - mysql_db
    restart: always

  # Contacts Service
  contacts_service:
    container_name: contacts_service_container
    build:
      context: ./backend/contacts_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "${CONTACTS_SERVICE_PORT}:8000"
    volumes:
      - ./backend/contacts_service:/app
      - ./logs/contacts_service:/app/logs
    networks:
      - says-network
    depends_on:
      - mysql_db
    restart: always

  # Bot Message Service
  bot_message_service:
    container_name: bot_message_service_container
    build:
      context: ./backend/bot_message_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "${BOT_MESSAGE_SERVICE_PORT}:8000"
    volumes:
      - ./backend/bot_message_service:/app
      - ./logs/bot_message_service:/app/logs
    networks:
      - says-network
    depends_on:
      - mysql_db
    restart: always

  # Ngrok service for exposing bot_message_service webhook
  ngrok:
    container_name: ngrok_container
    build:
      context: ./backend/dev_tools/ngrok
      dockerfile: Dockerfile
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # ngrok web interface
    networks:
      - says-network
    depends_on:
      - bot_message_service
    restart: always

  # Web Frontend (Vite)
  web:
    container_name: web_container
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Expose Vite's default port
    environment:
      - VITE_LEANCLOUD_APP_ID=${VITE_LEANCLOUD_APP_ID}
      - VITE_LEANCLOUD_APP_KEY=${VITE_LEANCLOUD_APP_KEY}
      - VITE_LEANCLOUD_SERVER_URL=${VITE_LEANCLOUD_SERVER_URL}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_APP_VERSION=${VITE_APP_VERSION}
      - VITE_BRAND_NAME=${VITE_BRAND_NAME}
      - VITE_MESSAGE_TYPING_AUTO_HIDE=${VITE_MESSAGE_TYPING_AUTO_HIDE}
    volumes:
      - ./frontend/web:/app # Mount local code for hot-reloading
      - /app/node_modules # Anonymous volume to prevent local node_modules from overwriting container's
    networks:
      - says-network
    depends_on:
      - accounts_service # Depends on the API gateway/relevant backend service
    restart: always

  # Web Development Frontend
  web_dev:
    container_name: web_dev_container
    build:
      context: ./frontend/web_dev
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - says-network
    restart: always

  # Log Viewer Service
  dozzle:
    container_name: dozzle_container
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"
    restart: always
    networks:
      - says-network

# Define the network for services to communicate
networks:
  says-network:
    driver: bridge

# Define the volume for persistent database storage
volumes:
  mysql_data:
