<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <!-- Favicon Configuration -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_BRAND_NAME%</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="%VITE_PWA_THEME_COLOR%">
  <meta name="description" content="%VITE_APP_DESCRIPTION%">
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" sizes="192x192">

  <!-- Apple PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="%VITE_BRAND_NAME%">

  <!-- Microsoft Tiles -->
  <meta name="msapplication-TileColor" content="%VITE_PWA_BACKGROUND_COLOR%">
  <meta name="msapplication-TileImage" content="/icons/icon-192x192.png">


</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>

</html>
