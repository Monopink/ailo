server {
    listen 80;
    server_name localhost;

    # Serve static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for API calls
    # This location block is an example. If your API is hosted elsewhere,
    # you might not need it, or you might need to adjust the proxy_pass directive.
    location /api/ {
        # The URL here should match the service name and port of your backend API
        # as accessible from within the Docker network.
        # This is often 'http://<service_name>:<port>'.
        # For example: 'http://backend:8000'
        # Since the full URL is constructed in api.js, we might not need this proxy,
        # but it's good practice for production setups where the frontend and backend
        # are served under the same domain.
        
        # We will rely on the full URL specified in VITE_API_BASE_URL for now.
        # If you were to use a relative path for API calls in the frontend,
        # you would uncomment and configure the block below.
        
        # proxy_pass http://backend:8000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Add error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
} 