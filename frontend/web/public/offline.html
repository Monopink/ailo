<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敲敲 - 已离线</title>
  <style>
    /* Modern Design System - Apple-inspired Variables */
    :root {
      /* Light Mode Colors - Modern Style */
      --color-bg-primary: #ffffff;
      --color-bg-secondary: #f8f9fa;
      --color-bg-tertiary: #f1f3f4;
      --color-bg-quaternary: #e9ecef;
      --color-bg-app: #f5f5f7;
      --color-border: #e1e5e9;
      --color-border-light: rgba(225, 229, 233, 0.3);
      --color-border-subtle: rgba(0, 0, 0, 0.06);

      /* Text Colors - Refined Hierarchy */
      --color-text-primary: #1d1d1f;
      --color-text-secondary: #6e6e73;
      --color-text-tertiary: #8e8e93;

      /* Green Primary System - Enhanced */
      --color-primary: #07c160;
      --color-primary-hover: #06ad56;

      /* Typography System - Unified Sizes */
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      --font-size-sm: 13px;
      --font-size-base: 14px;
      --font-size-lg: 16px;
      --font-size-xl: 18px;
      --font-size-2xl: 20px;
      --font-weight-normal: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;

      /* Modern UI Attributes - Refined Radius */
      --radius-lg: 8px;
      --radius-xl: 10px;

      /* Enhanced Shadow System */
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);

      /* Spacing System */
      --spacing-lg: 12px;
      --spacing-xl: 16px;
      --spacing-2xl: 20px;
      --spacing-3xl: 24px;
    }

    /* Dark Mode - Modern Style */
    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Background System */
        --color-bg-primary: #1c1c1e;
        --color-bg-secondary: #2c2c2e;
        --color-bg-tertiary: #3a3a3c;
        --color-bg-quaternary: #48484a;
        --color-bg-app: #000000;
        --color-border: #48484a;
        --color-border-light: rgba(72, 72, 74, 0.3);
        --color-border-subtle: rgba(255, 255, 255, 0.08);

        /* Dark Text Colors */
        --color-text-primary: #f2f2f7;
        --color-text-secondary: #8e8e93;
        --color-text-tertiary: #636366;

        /* Green Primary - Dark Mode (Softer) */
        --color-primary: #32d74b;
        --color-primary-hover: #30d158;
      }
    }

    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-app);
      color: var(--color-text-primary);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: var(--spacing-xl);
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: var(--spacing-3xl);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      background: var(--color-bg-primary);
      box-shadow: var(--shadow-lg);
    }

    h1 {
      color: var(--color-text-primary);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-xl);
    }

    p {
      color: var(--color-text-secondary);
      font-size: var(--font-size-base);
      margin-bottom: var(--spacing-2xl);
      line-height: 1.6;
    }

    .btn {
      background: var(--color-primary);
      color: white;
      border: none;
      padding: var(--spacing-lg) var(--spacing-2xl);
      border-radius: var(--radius-lg);
      cursor: pointer;
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      transition: background-color 0.15s ease;
      min-width: 120px;
    }

    .btn:hover {
      background: var(--color-primary-hover);
    }

    /* Mobile optimizations */
    @media (max-width: 767px) {
      .container {
        margin: var(--spacing-xl);
        padding: var(--spacing-2xl);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>无网络连接</h1>
    <p>似乎网络连接已中断，请检查网络连接或稍后再试。</p>
    <button class="btn" onclick="window.location.reload()">重试连接</button>
  </div>

  <script>
    // Set dynamic page title
    const brandName = localStorage.getItem('brandName') ||
      sessionStorage.getItem('brandName') ||
      new URLSearchParams(window.location.search).get('brand');

    if (brandName) {
      document.title = `${brandName} - 离线模式`;
    }

    // Check network status when page loads
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Check for stored theme preference
    const storedTheme = localStorage.getItem('theme');
    if (storedTheme) {
      document.documentElement.setAttribute('data-theme', storedTheme);
    }
  </script>
</body>

</html>
