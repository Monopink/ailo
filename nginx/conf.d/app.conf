# Unified Nginx gateway template for staging/prod.
# Runtime variables:
# - DOMAIN
# - BACKEND_UPSTREAM (e.g. backend:8000 / backend_staging:8000)
# - ADMIN_AUTH_REALM

upstream backend {
    server ${BACKEND_UPSTREAM};
}

upstream dozzle {
    server dozzle:8080;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;
map_hash_bucket_size 256;

map $http_user_agent $ua_block_exact {
    default 0;
    "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36 MicroMessenger/7.0.20.1781(0x6700143B) NetType/WIFI MiniProgramEnv/Windows WindowsWechat/WMPF XWEB/1000/Tencent Security Team" 1;
}

map $http_user_agent $ua_has_tencent_security_team {
    default 0;
    ~*tencent\ security\ team 1;
}

map $http_user_agent $ua_has_windows_wechat_wmpf {
    default 0;
    ~*windowswechat/wmpf 1;
}

map $http_user_agent $ua_has_miniprogramenv_windows {
    default 0;
    ~*miniprogramenv/windows 1;
}

map $http_user_agent $ua_has_xweb_1000 {
    default 0;
    ~*xweb/1000 1;
}

map "$ua_has_windows_wechat_wmpf$ua_has_miniprogramenv_windows$ua_has_xweb_1000" $ua_block_secondary_combo {
    default 0;
    111 1;
}

map "$ua_has_tencent_security_team$ua_block_secondary_combo" $ua_block_pattern {
    default 0;
    ~1 1;
}

map "$ua_block_exact$ua_block_pattern" $ua_block_final {
    default 0;
    ~1 1;
}

map $request_uri $api_attack_rule_code {
    default "";
    ~*(?:'|%27)\s*(?:or|and)\s*\d+\s*=\s*\d+ "sql_injection";
    ~*\bunion\b\s+\bselect\b "sql_injection";
    ~*\bselect\b\s*\*\s*\bfrom\b "sql_injection";
    ~*\bsleep\s*\( "sql_injection";
    ~*\bbenchmark\s*\( "sql_injection";
    ~*(?:\.\./|\.\.\\|%2e%2e%2f|%2e%2e%5c|/etc/passwd|/proc/self|/windows/win\.ini) "path_traversal";
    "~*(?:;|&&|\|\|)\s*(?:cat|bash|sh|curl|wget|python|perl|powershell|cmd)\b" "command_injection";
}

map $api_attack_rule_code $api_attack_flag {
    default 0;
    "" 0;
    ~.+ 1;
}

map $remote_addr $ua_security_ip_mark {
    default 0;
    106.55.202.118 1;
    113.96.223.69 1;
    125.39.132.125 1;
}

log_format gateway_main
    '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'ua_block_final=$ua_block_final ua_block_exact=$ua_block_exact ua_block_pattern=$ua_block_pattern '
    'ua_block_secondary_combo=$ua_block_secondary_combo ua_security_ip_mark=$ua_security_ip_mark '
    'api_attack_flag=$api_attack_flag api_attack_rule_code=$api_attack_rule_code';

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};
    proxy_set_header X-Client-IP $remote_addr;
    access_log /var/log/nginx/access.log gateway_main;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    location /qiao-dash/statics/ {
        auth_basic "${ADMIN_AUTH_REALM}";
        auth_basic_user_file /etc/nginx/.htpasswd;
        access_log /var/log/nginx/admin_access.log combined;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /qiao-dash/ {
        auth_basic "${ADMIN_AUTH_REALM}";
        auth_basic_user_file /etc/nginx/.htpasswd;
        access_log /var/log/nginx/admin_access.log combined;
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://backend/qiao-dash/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location /admin-api/ {
        auth_basic "${ADMIN_AUTH_REALM}";
        auth_basic_user_file /etc/nginx/.htpasswd;
        access_log /var/log/nginx/admin_access.log combined;
        limit_req zone=admin burst=10 nodelay;
        client_max_body_size 2M;
        proxy_pass http://backend/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /ops/logs {
        return 301 /ops/logs/;
    }

    location /ops/logs/ {
        auth_basic "Logs Viewer";
        auth_basic_user_file /etc/nginx/.htpasswd_logs;
        access_log /var/log/nginx/logs_access.log combined;
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://dozzle;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ops/logs;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;
    }

    location /ws/messages {
        if ($api_attack_flag = 1) {
            return 403;
        }
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    location /i/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend/i/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Keep auth under stricter rate limits while covering all new auth endpoints.
    location /api/v1/auth/ {
        if ($ua_block_final = 1) {
            return 403;
        }
        if ($api_attack_flag = 1) {
            return 403;
        }
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Unified API proxy to avoid endpoint drift between environments.
    location /api/v1/ {
        if ($ua_block_final = 1) {
            return 403;
        }
        if ($api_attack_flag = 1) {
            return 403;
        }
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 2M;
        proxy_pass http://backend/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /webhook/leanmessage {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend/webhook/leanmessage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404 "Not Found";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
