# Staging Environment Nginx Configuration
# Domain: ark3.qiaoqiaoai.cn

# Upstream backend
upstream backend_staging {
    server backend_staging_container:8000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_staging:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_staging:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_staging:10m rate=20r/s;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name ark3.qiaoqiaoai.cn;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name ark3.qiaoqiaoai.cn;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/ark3.qiaoqiaoai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ark3.qiaoqiaoai.cn/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # === ADMIN PANEL ===
    # Static files for admin panel
    location /qiao-dash/statics/ {
        proxy_pass http://backend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /qiao-dash/ {
        limit_req zone=admin_staging burst=30 nodelay;
        proxy_pass http://backend_staging/qiao-dash/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin panel may need longer timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Support large file uploads
        client_max_body_size 10M;
    }

    # === API ROUTES ===
    # Admin API endpoints (requires admin authentication)
    location /admin-api/ {
        limit_req zone=admin_staging burst=30 nodelay;
        proxy_pass http://backend_staging/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Auth endpoints with stricter rate limiting
    location /api/v1/auth/send-code {
        limit_req zone=login_staging burst=3 nodelay;
        proxy_pass http://backend_staging/api/v1/auth/send-code;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/v1/auth/phone {
        limit_req zone=login_staging burst=3 nodelay;
        proxy_pass http://backend_staging/api/v1/auth/phone;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/v1/auth/complete-registration {
        limit_req zone=login_staging burst=3 nodelay;
        proxy_pass http://backend_staging/api/v1/auth/complete-registration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/v1/auth/login {
        limit_req zone=login_staging burst=3 nodelay;
        proxy_pass http://backend_staging/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # General API endpoints
    location /api/ {
        limit_req zone=api_staging burst=20 nodelay;
        proxy_pass http://backend_staging/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # LeanCloud webhook
    location /webhook/leanmessage {
        limit_req zone=api_staging burst=50 nodelay;
        proxy_pass http://backend_staging/webhook/leanmessage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint (internal only, not exposed)
    # Uncomment if you need external health check
    # location /health {
    #     access_log off;
    #     proxy_pass http://backend_staging/health;
    #     proxy_set_header Host $host;
    # }

    # API documentation (disabled for security)
    # Uncomment if you need to access API docs
    # location /docs {
    #     proxy_pass http://backend_staging/docs;
    #     proxy_set_header Host $host;
    # }
    # location /redoc {
    #     proxy_pass http://backend_staging/redoc;
    #     proxy_set_header Host $host;
    # }

    # Default location - return 404
    location / {
        return 404 "Not Found";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
