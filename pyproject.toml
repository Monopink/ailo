# ============================================================================
# Pylint Configuration
# ============================================================================
[tool.pylint.main]
# Use multiple processes to speed up Pylint
jobs = 0
# Minimum Python version to use for version dependent checks
py-version = "3.12"
# Set Python path to include backend/app directory
init-hook = 'import sys; sys.path.insert(0, "backend/app")'

[tool.pylint.format]
max-line-length = 108
indent-string = "    "  # 4 spaces

[tool.pylint.typecheck]
# SQLAlchemy func object uses __getattr__ to dynamically generate SQL functions
generated-members = ["func.*"]
# Alembic context is injected at runtime
ignored-modules = ["alembic.context"]

[tool.pylint.basic]
# Allow common variable names including 'cls' for Pydantic validators
good-names = ["cls", "db", "id", "i", "j", "k", "ex", "_"]
# Naming conventions
argument-naming-style = "snake_case"
attr-naming-style = "snake_case"
class-naming-style = "PascalCase"
const-naming-style = "UPPER_CASE"
function-naming-style = "snake_case"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
variable-naming-style = "snake_case"

[tool.pylint.messages_control]
# Disable specific false positives
disable = [
    "fixme",  # Allow TODO comments during development
    "too-few-public-methods",  # Pydantic models often have few methods
    "missing-module-docstring",  # Not required for all modules in MVP
    "missing-class-docstring",  # Not required for all classes in MVP
    "missing-function-docstring",  # Not required for all functions in MVP
]

[tool.pylint.design]
max-args = 7  # Maximum number of arguments for function/method
max-attributes = 12  # Maximum number of attributes for a class
max-branches = 15  # Maximum number of branch for function/method body
max-locals = 20  # Maximum number of locals for function/method body
max-returns = 6  # Maximum number of return/yield for function/method body
max-statements = 60  # Maximum number of statements in function/method body

# ============================================================================
# Black Configuration (Code Formatter)
# ============================================================================
[tool.black]
line-length = 108
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.pytest_cache
  | __pycache__
  | migrations
)/
'''

# ============================================================================
# isort Configuration (Import Sorter)
# ============================================================================
[tool.isort]
profile = "black"
line_length = 108
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/__pycache__/*", "*/venv/*"]
known_first_party = ["app"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ============================================================================
# mypy Configuration (Type Checker)
# ============================================================================
[tool.mypy]
python_version = "3.12"
# Set mypy path to find modules in backend/app
mypy_path = "backend/app"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start with false, gradually enable
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "volcengine.*",
    "alibabacloud_tea_openapi.*",
    "alibabacloud_captcha20230305.*",
    "zhdate.*",
    "starlette_admin.*",
]
ignore_missing_imports = true

# ============================================================================
# pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--asyncio-mode=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["backend/app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
