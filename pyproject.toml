# ============================================================================
# Ruff Configuration (Replaces: black, isort, pylint)
# ============================================================================
[tool.ruff]
line-length = 100 # Unified line length standard
target-version = "py312"

# Exclude directories
extend-exclude = [
  "migrations",
  "__pycache__",
  ".venv",
  "venv",
  "*.egg-info",
]

[tool.ruff.lint]
# Enable rule sets
select = [
  # Docstring
  "D", # pydocstyle - enabled with selective ignores for progressive adoption
  # Pyflakes
  "F", # pycodestyle
  "E",
  "W", # isort
  "I", # pep8-naming
  "N", # pyupgrade
  "UP", # flake8-annotations
  "ANN", # flake8-async
  "ASYNC", # flake8-bandit (security)
  "S", # flake8-bugbear
  "B", # flake8-builtins
  "A", # flake8-comprehensions
  "C4", # flake8-datetimez
  "DTZ", # flake8-debugger
  "T10", # flake8-errmsg
  "EM", # flake8-implicit-str-concat
  "ISC", # flake8-import-conventions
  "ICN", # flake8-pie
  "PIE", # flake8-pytest-style
  "PT", # flake8-quotes
  "Q", # flake8-raise
  "RSE", # flake8-return
  "RET", # flake8-simplify
  "SIM", # flake8-tidy-imports
  "TID", # flake8-unused-arguments
  "ARG", # flake8-use-pathlib
  "PTH", # pylint
  "PL", # tryceratops
  "TRY", # ruff-specific
  "RUF",
]

# Ignore rules (mapped from previous pylint config)
ignore = [
  # Docstring rules - selective enablement for progressive adoption
  "D100", # Missing docstring in public module (not all modules need docs)
  "D104", # Missing docstring in public package (not all __init__.py need docs)
  "D105", # Missing docstring in magic method (often self-explanatory)
  "D107", # Missing docstring in __init__ (often simple assignments)
  "D203", # Disable due to conflict with D211 (per project preference)
  "PLR0913", # Too many arguments (handled by max-args below)
  "S101", # Use of assert (needed in tests)
  "ISC001", # Conflicts with formatter (implicit string concatenation)  # MVP stage relaxations - gradually fix these issues
  # "ANN401" removed - Control Any usage via per-file-ignores for precision
  "TRY003", # Allow long exception messages
  "TRY400", # Allow logger.error in except blocks
  "EM101", # Allow string literals in exceptions
  "EM102", # Allow f-strings in exceptions
  "RUF001", # Allow full-width punctuation for Chinese content  # AI-friendly code style - prefer explicit over implicit
  "SIM102", # Keep nested if statements for clarity (AI-friendly)
  "SIM105", # Keep explicit try-except blocks (AI-friendly)
  "SIM108", # Keep if-else blocks over ternary operators (AI-friendly)
  "TRY301", # Allow inline raise (avoid over-abstraction, AI-friendly)
  "TRY300", # Allow return in try block (else block often less clear for AI)
  "B904", # Allow raise without exception chaining (already logging errors)
  "RUF022", # Allow logical grouping in __all__ over alphabetical sorting (AI-friendly)
  "D213", # Disable due to conflict with D212, prefer the more permissive layout
]

[tool.ruff.lint.per-file-ignores]
# Test files special rules
"backend/tests/**/*.py" = [
  "S101", # Allow assert in tests
  "PLR2004", # Allow magic values in tests
  "ANN", # Don't require annotations in tests
  "D", # Don't require docstrings in tests
]
"tests/**/*.py" = [
  "S101", # Allow assert in tests
  "PLR2004", # Allow magic values in tests
  "ANN", # Don't require annotations in tests
  "D", # Don't require docstrings in tests
]
# Migration files special rules
"**/migrations/**/*.py" = ["ALL"]
# Internal services - progressive docstring adoption
"backend/app/services/**/*.py" = [
  "D", # Progressive docstring adoption for internal services
]
# Admin API files - allow FastAPI patterns and higher complexity
"backend/app/api/admin/**/*.py" = [
  "B008", # Allow Depends() in function defaults (FastAPI pattern)
  "TRY301", # Allow raise in try blocks (admin error handling pattern)
  "PLR0912", # Allow higher branch complexity for admin endpoints
  "PLR0915", # Allow higher statement count for admin endpoints
  "D200", # Allow API docstrings to be succinct without reflow
  "D205", # Allow summary line to be immediately followed by description
]
# API v1 files - allow FastAPI Depends() pattern
"backend/app/api/v1/**/*.py" = [
  "B008", # Allow Depends() in function defaults (FastAPI pattern)
  "D200", # LeanCloud/API v1 modules keep short headers
  "D205", # Allow immediate descriptions after summary lines
]
# Auth API - authentication flows require more complexity
"backend/app/api/v1/auth.py" = [
  "B008", # Allow Depends() in function defaults (FastAPI pattern)
  "PLR0912", # Allow higher branch complexity for auth flows
  "PLR0915", # Allow higher statement count for auth flows
  "TRY301", # Allow inline raise for clear error handling
]
# Schema files - allow Any for dynamic external data structures
"backend/app/schemas/auth.py" = [
  "ANN401", # Allow Any for external auth response fields
]
# Admin testing services - allow Any for flexible test data and reserved parameters
"backend/app/services/admin/testing/**/*.py" = [
  "ANN401", # Allow Any for test service flexibility
  "ARG002", # Allow unused parameters (reserved for future features)
]
# Admin docstrings and small helpers - only focused validation in this module tree
"backend/app/admin/**/*.py" = [
  "D102", # Allow simple permission overrides without docstrings
  "D200", # Allow docs that span multiple lines for descriptive clarity
  "D202", # Allow blank lines after docstrings
  "D205", # Allow multi-line descriptions without forced spacing after summary
  "D212", # Allow multi-line summaries with additional blank lines
  "D213", # Allow nested blank-line summaries
  "D400", # Allow sentences without period for concise descriptions
  "D401", # Allow imperative mood relaxation for admin helpers
  "D413", # Allow Docs without blank line after sections for readability
  "D415", # Allow slight punctuation variations for admin logging helpers
  "D107", # __init__ docstrings may be omitted
]
"backend/app/utils/validation.py" = [
  "ANN401", # Allow Any usage for validation helpers
]
# Admin main module - allow Any for Jinja2 templates and framework compatibility
"backend/app/admin/main.py" = [
  "ANN401", # Allow Any for template rendering and framework integration
]
# Contact service - allow Any for flexible tag structures
"backend/app/services/contact/service.py" = [
  "ANN401", # Allow Any for dynamic tag structures
]
# Admin fields - Starlette Admin framework signature requirements
"backend/app/admin/fields.py" = [
  "ANN401", # Starlette Admin requires Any in field signatures (framework limitation)
]
# Admin base views - Starlette Admin framework signature requirements
"backend/app/admin/views/base.py" = [
  "ANN401", # Starlette Admin requires Any in field/view signatures (framework limitation)
  "ARG002", # Framework requires request parameter in permission methods
]
# Admin views - Starlette Admin framework requirements and config attributes
"backend/app/admin/views/**/*.py" = [
  "B008", # Allow Depends() in function defaults (FastAPI pattern)
  "PLR0912", # Allow higher branch complexity for admin views
  "PLR0915", # Allow higher statement count for admin views
  "ANN401", # Starlette Admin requires Any in view method signatures (framework limitation)
  "ARG002", # Framework requires unused parameters in hooks/permissions
  "RUF012", # Starlette Admin config lists are class-level, not ClassVar
  "E501", # Allow long lines in help_text for better readability
]
# LeanCloud service - utility function validates config dict values of unknown type
"backend/app/services/message/providers/leancloud/service.py" = [
  "ANN401", # _get_non_empty_str validates config dict values (can be any type)
]
# Message processing - allow random for non-security timing/probability logic
"backend/app/services/message/processing/*.py" = [
  "S311", # Allow random module for message timing simulation and reply probability
]
# Admin data queries - S608 exemption with security review
# SECURITY: This file uses f-string SQL for query building BUT with strict safety constraints:
# 1. All user input MUST be parameterized (no direct string interpolation)
# 2. Only FIXED string fragments can be in f-string (e.g., column names, WHERE clauses)
# 3. Dynamic parts use :param_name with values dict passed to db.execute()
# Example: f"SELECT * FROM t WHERE 1=1{fixed_where}" with execute(sql, {"id": user_input})
# Reviewed: 2026-01-08 - Uses safe pattern with where_extra as fixed string
"backend/app/services/admin/data/style_dimensions.py" = [
  "S608", # Allow f-string SQL with parameterized values (reviewed for safety)
  "E501", # Allow long SQL lines for readability
]

[tool.ruff.lint.pylint]
# Corresponds to previous pylint design config
# Note: Auth flows naturally require more complexity due to multi-step validation
max-args = 7
max-branches = 20 # Increased for auth flows (was 15)
max-returns = 6
max-statements = 80 # Increased for auth flows (was 60)

[tool.ruff.lint.flake8-unused-arguments]
# Allow unused arguments starting with underscore (common in framework callbacks)
ignore-variadic-names = true

[tool.ruff.lint.isort]
# Corresponds to previous isort config
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Corresponds to previous black config
indent-style = "space"
line-ending = "auto"
quote-style = "double"

# ============================================================================
# mypy Configuration (Type Checker)
# ============================================================================
[tool.mypy]
explicit_package_bases = true
mypy_path = ["backend"]
python_version = "3.12"

# ============================================================================
# Core Strict Checks (Any-related)
# ============================================================================
# Enforce explicit type annotations, balance flexibility with safety
disallow_any_decorated = false # Allow for FastAPI decorators compatibility
disallow_any_explicit = false # Allow explicit Any (controlled via per-file ignores)
disallow_any_generics = true # Prohibit generic types without parameters
disallow_any_unimported = true # Prohibit Any from untyped libraries

# ============================================================================
# Function and Type Definition Checks
# ============================================================================
check_untyped_defs = true # Check untyped function bodies
disallow_incomplete_defs = true # Require complete type annotations
disallow_untyped_calls = false # Allow for third-party library compatibility
disallow_untyped_decorators = true # Require typed decorators
disallow_untyped_defs = true # Prohibit functions without type annotations

# ============================================================================
# Advanced Type Safety
# ============================================================================
disallow_subclassing_any = true # Prohibit subclassing Any
no_implicit_optional = true # Prohibit implicit Optional
no_implicit_reexport = true # Require explicit __all__ for re-exports
strict_optional = true # Strict Optional checking

# ============================================================================
# Warning Levels
# ============================================================================
warn_incomplete_stub = true # Warn on incomplete stub files
warn_no_return = true # Warn on missing return statements
warn_redundant_casts = true # Warn on unnecessary casts
warn_return_any = true # Warn on functions returning Any
warn_unreachable = true # Warn on unreachable code
warn_unused_configs = true # Warn on unused config options
warn_unused_ignores = true # Warn on unused type: ignore (prevent abuse)

# ============================================================================
# Error Display Optimization (AI-friendly)
# ============================================================================
color_output = true # Colorize output for readability
pretty = true # Pretty-print error messages
show_column_numbers = true # Show column numbers in errors
show_error_codes = true # Show error codes (e.g., [misc])
show_error_context = true # Show error context to help AI understand

# ============================================================================
# Performance and Compatibility
# ============================================================================
strict = false # Use granular strict checks instead of strict=true
strict_equality = true # Enforce strict equality checks

# Pydantic plugin for better type inference
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Enable stricter checking for Pydantic models
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true # Warn on untyped Pydantic fields

# ============================================================================
# Third-party Library Handling
# ============================================================================
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "alibabacloud_tea_openapi.*",
  "alibabacloud_captcha20230305.*",
  "zhdate.*",
  "jsonschema.*",
]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "fsspec",
  "fsspec.*",
]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "boto3",
  "botocore",
  "botocore.*",
]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "passlib",
  "passlib.*",
]

# ============================================================================
# Admin Module - Relaxed Type Checking
# ============================================================================
# The admin module uses Starlette Admin framework which has API design conflicts
# with Python's type system. See app/admin/AGENTS.md for details.
[[tool.mypy.overrides]]
module = [
  "app.admin.views.*",
  "app.admin.fields.*",
]
# Allow known framework limitations
disable_error_code = [
  "misc", # "Cannot override instance variable with class variable"
  "union-attr", # JSONValue union type attribute access
  "arg-type", # Starlette Admin API type mismatches
  "list-item", # Starlette Admin field list type system conflict
  "index", # JSON dynamic indexing in test views
  "call-overload", # JSON method overload in test views
  "return-value", # Admin view return type flexibility
  "dict-item", # JSON dict type flexibility
  "no-any-return", # Allow Any returns in admin views
  "assignment", # Admin framework assignment flexibility
]

# Testing module - Dynamic JSON handling
[[tool.mypy.overrides]]
disable_error_code = [
  "union-attr", # JSONValue union type requires runtime type guards
  "index", # JSON dynamic indexing
  "call-overload", # JSON method overload
  "no-any-return", # Allow Any returns in testing code
  "dict-item", # JSON dict type flexibility
]
module = [
  "app.services.admin.testing.*",
]

[[tool.mypy.overrides]]
disable_error_code = [
  "no-untyped-def",
  "arg-type",
  "return-value",
]
disallow_untyped_calls = false
disallow_untyped_defs = false
module = [
  "backend.tests.*",
]

# ============================================================================
# pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--asyncio-mode=auto",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/__pycache__/*",
  "*/venv/*",
]
source = ["backend/app"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
